name: forge
services:
  web:
    build: ../forge-web
    ports: ["127.0.0.1:5179:80"]
    environment:
      API_UPSTREAM: http://api:3009
    depends_on: [api]
  api:
    build: ../forge-api
    ports: ["127.0.0.1:3009:3009"]
    environment:
      PROVIDER: demo
      SERVER_ADDRESS: 0.0.0.0
      PORT: "3009"
      WEB_ORIGIN: http://127.0.0.1:5179,http://localhost:5179
      KNOWLEDGE_URL: http://knowledge:3017
      KNOWLEDGE_ALLOW_HTTP: "true"
      KNOWLEDGE_TOKEN: ${KNOWLEDGE_TOKEN:?Set a shared internal service token}
    volumes: ["api-data:/app/data"]
    depends_on: [knowledge]
  knowledge:
    build: ../forge-knowledge
    environment:
      KNOWLEDGE_TOKEN: ${KNOWLEDGE_TOKEN:?Set a shared internal service token}
      KNOWLEDGE_DATABASE_URL: sqlite:////app/data/knowledge.db
      KNOWLEDGE_EMBEDDING_BASE_URL: ${KNOWLEDGE_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_EMBEDDING_API_KEY: ${KNOWLEDGE_EMBEDDING_API_KEY:-}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-}
      KNOWLEDGE_EMBEDDING_DIMENSION: ${KNOWLEDGE_EMBEDDING_DIMENSION:-1024}
    volumes: ["knowledge-data:/app/data"]
volumes:
  api-data:
  knowledge-data:
