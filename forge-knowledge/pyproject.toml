[project]
name = "forge-knowledge"
version = "0.1.0"
description = "Project-scoped document ingestion and retrieval for Forge"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "llama-index-core>=0.12,<1", "sqlalchemy>=2.0,<3",
  "pgvector>=0.4,<1", "psycopg[binary]>=3.2,<4", "pypdf>=6,<7",
  "python-docx>=1.1,<2", "beautifulsoup4>=4.13,<5"
]
[project.optional-dependencies]
local-models = ["sentence-transformers>=3,<6"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/forge_knowledge"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
